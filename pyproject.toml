[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "soc-llm-conformity"
version = "0.1.0"
description = "Second-Order Cybernetics & LLM Conformity: Research Archive and arXiv Harvester"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "SOC-LMC Contributors" }
]
keywords = [
    "second-order-cybernetics",
    "large-language-models",
    "linguistic-conformity",
    "semantic-homogenization",
    "interactive-alignment",
    "model-collapse",
    "autopoiesis",
    "structural-coupling"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Sociology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
arxiv-harvester = "tools.arxiv_harvester:main"
generate-index = "tools.generate_index:main"
